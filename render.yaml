# Render Blueprint: NurtureNet API + Postgres + Redis (Key Value).
# Free plans are for testing: the API sleeps after 15 min idle and the free Postgres expires after 30 days.
# Move to paid plans before a real pilot (change `plan:` and push).
services:
  - type: web
    name: nurturenet-api
    runtime: node
    region: frankfurt
    plan: free
    branch: main
    buildCommand: cd backend && npm ci --omit=dev
    # Migrations run on every start; already-applied ones are skipped.
    startCommand: cd backend && node scripts/migrate.js && node src/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.18.0
      - key: DATABASE_URL
        fromDatabase:
          name: nurturenet-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: nurturenet-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        value: "*"
      - key: ALADHAN_BASE_URL
        value: https://api.aladhan.com/v1
      - key: TERMII_SENDER_ID
        value: NurtureNet

  - type: keyvalue
    name: nurturenet-redis
    region: frankfurt
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

databases:
  - name: nurturenet-db
    region: frankfurt
    plan: free
    databaseName: nurturenet
    user: nurture
    postgresMajorVersion: "16"
